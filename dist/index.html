<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Índice de archivos</title>
  <style>
    body { font-family: monospace; padding: 20px; background: #f9f9f9; }
    ul { list-style: none; padding: 0; }
    li { margin: 8px 0; }
    a { text-decoration: none; color: #0366d6; font-size: 16px; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <h2>Índice de archivos</h2>
  <hr>
  <ul id="files">Cargando...</ul>

  <script>
    const trimmedURI = document.baseURI.slice(0,document.baseURI.length-1);
    const PATH = String(trimmedURI.split("/").slice(4));

    fetch(`https://api.github.com/repos/siddhartasr10/action-webpage-source/contents/${PATH}?ref=gh-pages`)
      .then(res => res.json())
      .then(data => {
        const list = document.getElementById('files');
        list.innerHTML = '';
        data.forEach(item => {
          if (item.name !== 'index.html') {
            list.innerHTML += `<li>${item.type === 'dir' ? '📁' : '📄'} <a href="${item.name}">${item.name}</a></li>`;
          }
        });
      });
  </script>
</body>
</html>
